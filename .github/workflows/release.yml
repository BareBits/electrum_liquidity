name: CI

# `beta` is the pre-release channel: code lands there ahead of main and is
# published as a suffixed, pre-release tag (v0.5.0-beta.1), so a build can be
# installed by hand without being offered to everyone. See the pre-release note
# on the release step below for what actually keeps those builds out of users'
# way.
#
# The two channels are cut differently, on purpose:
#   * stable is cut by pushing a tag -- a deliberate, manual act;
#   * beta is cut by pushing CODE. Every push to `beta` that passes the tests
#     publishes the next -beta.N automatically and retires the previous one, so
#     the channel always offers exactly one build: the tip of the branch.
# "Resolve the release tag" below is where that difference lives.
on:
  push:
    branches: [main, beta]
    tags: ['v*']
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: write

# Electrum tag the plugin is developed against. The glue/Qt tests import from a
# real Electrum, so CI checks out this exact tag and symlinks the plugin into it.
env:
  ELECTRUM_REF: '4.7.2'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt offscreen system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Clone Electrum ${{ env.ELECTRUM_REF }}
        run: git clone --depth 1 --branch "${ELECTRUM_REF}" https://github.com/spesmilo/electrum.git electrum-src

      - name: Install Electrum (editable) + test deps
        # Editable so `import electrum` resolves to ./electrum-src, where we
        # symlink the plugin below. A non-editable install would import from
        # site-packages and never see the plugin.
        run: |
          python -m pip install --upgrade pip
          pip install -e ./electrum-src
          pip install cryptography PyQt6 pytest

      - name: Symlink plugin into Electrum's plugins dir
        run: ln -s "${GITHUB_WORKSPACE}/inbound_liquidity" electrum-src/electrum/plugins/inbound_liquidity

      - name: Verify plugin imports (fail, don't silently skip)
        # The glue tests use pytest.importorskip on this module; if the import
        # breaks they would skip and the suite would go green on the engine
        # tests alone. Import it directly here so a real breakage fails CI.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import electrum.plugins.inbound_liquidity; print('plugin import OK')"
          python -c "import electrum.gui.qt.util; print('electrum qt import OK')"

      - name: Run tests (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        # -rs prints the reason for any skip, so a silently-skipped glue module
        # is visible in the log (the verify step above already hard-fails on the
        # import error that would cause such a skip).
        run: python -m pytest tests -q -rs

      - name: Multi-wallet GUI test (several wallets in one real Electrum)
        env:
          QT_QPA_PLATFORM: offscreen
          RUN_GUI_E2E: '1'
        # Lives under e2e/ but needs no rig: offline and offscreen, with
        # freshly created regtest wallets, so there is no bitcoind, no server
        # and no Docker -- 4 seconds, against a real ElectrumGui with real
        # windows. It is the regression test for "the Liquidity tab only shows
        # up in one of my open wallets", so it belongs in the PR CI rather than
        # in the opt-in rig workflow.
        run: timeout 300 python -m pytest e2e/tests/test_multi_wallet_gui_e2e.py -q -rs

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, which is what brings the tags with it. "Resolve the
          # release tag" counts existing -beta.N tags to pick the next one; on a
          # shallow clone it would see none and keep republishing beta.1.
          fetch-depth: 0

      - name: Read plugin version
        id: meta
        run: |
          version="$(python3 -c 'import json; print(json.load(open("inbound_liquidity/manifest.json"))["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "zip=inbound_liquidity-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        run: |
          # Package only the importable plugin package, excluding caches.
          zip -r "${{ steps.meta.outputs.zip }}" inbound_liquidity \
            -x '*/__pycache__/*' '*.pyc' '*/.pytest_cache/*'
          echo "----- zip contents -----"
          unzip -l "${{ steps.meta.outputs.zip }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip }}
          path: ${{ steps.meta.outputs.zip }}
          if-no-files-found: error

      - name: Resolve the release tag
        id: tag
        # Two ways in, one tag out:
        #   * a pushed tag releases exactly itself -- how stable is cut;
        #   * a push to `beta` arrives with no tag, so one is DERIVED here: the
        #     manifest version plus the next free -beta.N. That derivation is
        #     the whole of "a beta release is cut whenever code is pushed to
        #     beta"; without it a branch push builds a zip and publishes nothing.
        #
        # Anything else releases nothing: this step does not run, `tag` is
        # empty, and the two steps below are skipped. A push to main therefore
        # still only builds and uploads the artifact -- main is cut by tagging.
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/beta'
        # Pure shell against `env:`, like the steps below, so the derivation can
        # be executed verbatim by test_release_channel.
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "${REF_TYPE}" = "tag" ]; then
            tag="${REF_NAME}"
          else
            # The counter is read off the tags that exist rather than stored
            # anywhere, so it cannot drift from the repository. Retiring a beta
            # deletes its tag too (--cleanup-tag, below), but the newest beta is
            # always kept, so the maximum never goes backwards and an N is never
            # handed out twice.
            highest=0
            for existing in $(git tag --list "v${VERSION}-beta.*"); do
              n="${existing##*-beta.}"
              # Only a plain integer counts. A hand-made `v0.5.0-beta.4-fix`
              # must not read as 4 and collide with the real beta.4.
              case "${n}" in ''|*[!0-9]*) continue ;; esac
              if [ "${n}" -gt "${highest}" ]; then highest="${n}"; fi
            done
            tag="v${VERSION}-beta.$((highest + 1))"
          fi
          # Recomputed from the resolved tag, not from the ref, so a derived tag
          # and a hand-pushed one are classified by the same rule.
          case "${tag}" in
            *-beta.*) is_beta=true ;;
            *)        is_beta=false ;;
          esac
          echo "releasing ${tag} (beta channel: ${is_beta})"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "is_beta=${is_beta}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.tag.outputs.tag != ''
        # Every `${{ }}` this step needs is bound here rather than interpolated
        # into the script below, so the body is pure shell and can be executed
        # verbatim by test_release_channel against a stub `gh`.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          # The commit to hang a DERIVED tag on. Without it `gh release create`
          # creates a missing tag on the default branch, which would publish
          # main's code under a beta tag cut from the beta branch.
          TARGET: ${{ github.sha }}
        run: |
          set -eu
          # A tag whose version carries a suffix (v0.4.0-beta.1) is published as
          # a GitHub PRE-RELEASE. This flag is load-bearing, not cosmetic: the
          # plugin's update check reads /releases/latest, which GitHub documents
          # as excluding pre-releases, and `extract_release` independently drops
          # any payload flagged `prerelease`. Those two together are the whole
          # mechanism that keeps a beta build from being offered to everyone --
          # drop the flag and the next beta tag notifies every user who opted
          # into update checks.
          #
          # The test is semver's own: a hyphen after the version core marks a
          # pre-release, so v0.5.0 ships normally and v0.5.0-beta.1 does not.
          # Applied to the RESOLVED tag, so a tag derived from a push to `beta`
          # is judged by exactly the same rule as a hand-pushed one.
          case "${TAG}" in
            *-*) prerelease="--prerelease"; kind="pre-release" ;;
            *)   prerelease="";            kind="release" ;;
          esac
          echo "publishing ${TAG} as a ${kind}"

          # The notes are assembled in a file rather than passed as one --notes
          # string so the pre-release warning can be real multi-line markdown.
          #
          # A pre-release page must say what it is IN ITS BODY. The flag above
          # keeps a beta out of the update check, but it does nothing for
          # somebody who has already landed on the Releases page -- and the
          # "Pre-release" chip GitHub puts beside the title is a grey label that
          # is easy to miss next to a big green Assets list. These zips are
          # installed by hand, so the page is the only place the warning can go.
          notes="$(mktemp)"
          if [ -n "${prerelease}" ]; then
            # Heredoc bodies are written at this block's own indentation, which
            # YAML strips, so the markdown reaches `gh` flush against column 0.
            # Outdenting them any further would close the block scalar.
            cat >> "${notes}" <<WARNING
          > [!WARNING]
          > ## Warning: This is a BETA release and should not be installed as it is unstable and may result in funds loss, use the [latest stable release](${SERVER_URL}/${REPOSITORY}/releases/latest) instead
          >
          > This build is published so it can be exercised on throwaway or
          > small-balance wallets. It has not had the testing a numbered release gets.
          > It moves real money -- it opens channels and pays funds out over Lightning
          > and on-chain -- and it may be withdrawn or replaced without notice.

          WARNING
          fi
          cat >> "${notes}" <<NOTES
          Inbound Liquidity Manager plugin v${VERSION}. Install by importing the attached zip into Electrum's plugin manager.
          NOTES

          # --target is what makes a DERIVED tag land on the commit that was
          # pushed. For an existing (hand-pushed) tag gh leaves it where it is,
          # and GITHUB_SHA is that same commit anyway, so passing it always is
          # correct for both channels.
          gh release create "${TAG}" \
            "${ZIP}" \
            --title "${TAG}" \
            --target "${TARGET}" \
            --generate-notes \
            ${prerelease} \
            --notes-file "${notes}"

      - name: Delete previous beta releases
        # Publishing a beta retires every older one, so the beta channel holds
        # exactly one installable build: the newest. Betas are installed by hand
        # from this page, and a list of stale zips is a list of ways to install
        # the wrong thing.
        #
        # Narrow on both axes, deliberately:
        #   * only a -beta.* release prunes, and only -beta.* releases are
        #     pruned, so a future channel (v0.5.0-rc.1) is neither a trigger nor
        #     a victim;
        #   * the `isPrerelease` filter is a second, independent guard -- a real
        #     v0.5.0 is not a pre-release and so cannot be reached here even if
        #     the name test were ever loosened.
        # The tag goes with the release (--cleanup-tag); the commits it pointed
        # at stay reachable from the beta branch.
        #
        # Ordered after the publish above on purpose: if creating the new release
        # fails, the job stops here and the old betas are still installable.
        #
        # Gated on the resolved tag rather than on the ref, so it covers both
        # ways a beta can be cut: pushed code and a hand-pushed tag.
        if: steps.tag.outputs.is_beta == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          # gh applies --jq itself, so this is the tag names of pre-releases
          # only. Assigned rather than piped into the loop so that a failing
          # `gh release list` fails the step instead of quietly pruning nothing.
          # The limit is far above any plausible release count; it exists only
          # because gh paginates.
          prereleases="$(gh release list --limit 1000 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName')"
          if [ -z "${prereleases}" ]; then
            echo "no pre-releases found; nothing to prune"
            exit 0
          fi
          # `existing`, not `tag`: ${TAG} is the one being published and the two
          # would be a single typo apart.
          for existing in ${prereleases}; do
            if [ "${existing}" = "${TAG}" ]; then
              echo "keeping ${existing} (just published)"
              continue
            fi
            case "${existing}" in
              *-beta.*) ;;
              *) echo "keeping ${existing} (not a -beta.* build)"; continue ;;
            esac
            echo "deleting previous beta ${existing}"
            gh release delete "${existing}" --yes --cleanup-tag
          done
