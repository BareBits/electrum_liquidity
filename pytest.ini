; Shared pytest configuration for both suites in this repo:
;
;   tests/      -- the fast mocked/glue/Qt suite (seconds; runs in PR CI)
;   e2e/tests/  -- the regtest rig suite (minutes per test; opt-in, see e2e/README.md)
;
; Keeping one file at the repo root means both suites get the same deadline and
; marker discipline no matter which directory you invoke pytest from.
[pytest]

; --- deadlines ------------------------------------------------------------
; Every test gets a deadline, because the failure mode we actually hit is a
; HANG, not a wrong answer: a rig test waiting on a daemon that never comes up,
; or a glue test waiting on an asyncio future that is never resolved. Without a
; deadline those burn the whole CI budget and the log ends mid-test with no
; traceback -- the least debuggable failure there is.
;
; 300s is far above anything in tests/ (the slowest is well under 2s) and far
; below the 60-minute CI job budget. Rig tests legitimately need much longer and
; raise it themselves: e2e/tests/conftest.py stamps `rig_e2e` on every one of
; them, which carries its own, much larger timeout.
timeout = 300

; `signal` (SIGALRM in the main thread), not `thread`. The difference matters
; here: signal raises inside the test, so pytest still runs fixture teardown --
; which for a rig test is what shuts the stack down. `thread` kills the process
; outright and would leave bitcoind, Fulcrum, two Electrum daemons and a docker
; container orphaned for the next test to collide with.
timeout_method = signal

; --- markers --------------------------------------------------------------
; Strict, so a typo'd marker is an error rather than a silently-inert decorator
; that makes a test look selected when it is not.
addopts = --strict-markers

markers =
    rig_e2e: needs the full regtest rig (bitcoind + Fulcrum + nostr + Electrum daemons). Applied automatically to everything in e2e/tests that uses the `rig` fixture; gated behind RUN_RIG_E2E=1.
