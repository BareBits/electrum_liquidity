; Static type checking, scoped on purpose.
;
; The repo's convention is that type hints are added wherever the language
; supports them, but nothing enforced it, so they were decorative -- a hint
; could be wrong and no check would say so. This makes them load-bearing for
; the one module where that matters most.
;
; SCOPE: `liquidity_manager.py` only, the pure rules engine. It has no Electrum
; imports, so it type-checks in isolation and the result is about OUR code
; rather than about how well Electrum is annotated. It is also where a type
; error would be most expensive: it decides what to open, what to swap, and how
; much, from untrusted provider input.
;
; `__init__.py` is NOT checked yet. It currently reports 14 errors, a few of
; which look like genuine latent issues rather than noise (an `Any | None`
; dereferenced without a guard, an `str | None` used as a dict key, a float
; passed where an int is declared). Fixing those is a behaviour change and
; belongs in its own commit with its own tests -- silently adding ignores to
; make a green check would be worse than not having the check. Widen `files`
; below once they are dealt with.
[mypy]
files = inbound_liquidity/liquidity_manager.py
python_version = 3.12
; Electrum and PyQt6 ship no stubs we rely on here; the engine imports neither,
; but this keeps the check from failing on an incidental import later.
ignore_missing_imports = True
; Check only what `files` names. Without this, importing anything drags its
; module into the check and the scope above stops meaning anything.
follow_imports = silent
; An ignore for an error that no longer happens is an ignore that will outlive
; its reason and hide the next one.
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
